<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f5fbff">
<title>釣魚大作戰 | Fishing Frenzy</title>
<style>
  :root{--ink:#193750;--muted:#688296;--blue:#2587c7;--aqua:#e8f7ff;--line:#d9eaf4;--coral:#ff786c;--lime:#c5e95b;--shadow:0 16px 45px #28547314}
  *{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#f3fbff,#f8fbf0 65%,#fff9ef);color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
  button{font:inherit;color:inherit;cursor:pointer;border:0}
  .app{max-width:1180px;margin:auto;padding:20px 22px 30px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 16px}
  .brand{display:flex;align-items:center;gap:13px}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#83d9ec,#4c9de0);display:grid;place-items:center;font-size:28px;box-shadow:0 6px 14px #2488b52a}
  h1{font-size:clamp(23px,3vw,32px);line-height:1;margin:0;letter-spacing:-.7px}.subtitle{color:var(--muted);font-size:13px;margin-top:5px;font-weight:600}
  .top-note{border:1px solid #dcecf4;border-radius:999px;padding:9px 14px;background:#ffffffb8;color:#57778c;font-size:12px;font-weight:700}.header-actions{display:flex;align-items:center;gap:9px}.language-btn{border:1px solid #dcecf4;border-radius:999px;padding:9px 13px;background:#fff;color:#357595;font-size:12px;font-weight:900}.language-btn:active{transform:scale(.97)}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:stretch}
  .stage-card,.side-card{background:#ffffffd9;border:1px solid #deedf5;border-radius:25px;box-shadow:var(--shadow)}
  .stage-card{overflow:hidden;position:relative;padding:11px;height:clamp(420px,calc(100svh - 190px),650px);min-height:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#eaf8ff,#f6fcff)}
  canvas{width:100%;height:100%;position:absolute;inset:0;touch-action:none}
  .stage-hud{position:absolute;z-index:2;left:20px;right:20px;top:17px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
  .pill{border:1px solid #dcebf2;background:#fffffff0;border-radius:14px;padding:8px 12px;box-shadow:0 4px 12px #27526e12;font-size:12px;font-weight:800;color:#4f7188}
  .pill strong{color:#173b59;font-size:18px;margin-left:5px;letter-spacing:.3px}
  .stage-message{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86%,360px);padding:23px 24px 20px;border:1px solid #d9edf6;border-radius:24px;background:#fffffff2;box-shadow:0 18px 48px #17496a28;text-align:center;backdrop-filter:blur(10px);transition:opacity .2s,transform .2s}
  .stage-message.hidden,.stage-message[hidden]{display:none!important;opacity:0;pointer-events:none;visibility:hidden}
  .stage-message .emoji{font-size:38px;line-height:1.1;margin-bottom:8px}.stage-message h2{margin:0;font-size:22px}.stage-message p{font-size:14px;color:#658095;line-height:1.55;margin:9px 0 15px;white-space:pre-line}
  .message-btn{background:#2388c4;color:white;border-radius:13px;padding:11px 19px;font-weight:900;box-shadow:0 5px 0 #176b9d;transition:transform .1s,box-shadow .1s}.message-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #176b9d}
  .side-card{padding:18px;display:flex;flex-direction:column;gap:16px}
  .score-title{display:flex;align-items:center;justify-content:space-between}.score-title h2{font-size:16px;margin:0}.best{font-size:11px;color:#71899a;font-weight:750}
  .scoreboard{display:grid;gap:9px}.score-row{display:flex;align-items:center;gap:11px;border:1px solid #e1edf3;border-radius:15px;padding:10px 12px;background:#fbfdfe;transition:transform .2s,border-color .2s}.score-row.active{border-color:#63b6e3;background:#f1fbff;transform:translateX(2px)}
  .player-dot{width:13px;height:13px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 4px color-mix(in srgb,var(--pc),white 82%)}.player-label{font-size:13px;font-weight:800;flex:1}.player-points{font-size:20px;font-weight:950;color:#234d68}.player-points small{font-size:10px;color:#7a94a4;margin-left:3px}
  .controls h3{font-size:13px;margin:0 0 9px}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode-btn{border:1px solid #dceaf2;border-radius:13px;padding:10px 7px;background:white;font-size:12px;font-weight:800;color:#55768b}  .mode-btn.selected,.appearance-btn.selected{border-color:#63b6e3;background:#effaff;color:#1677b1;box-shadow:inset 0 0 0 1px #63b6e3}.appearance-btn{border:1px solid #dceaf2;border-radius:13px;padding:10px 7px;background:white;font-size:12px;font-weight:800;color:#55768b}.speed-control{margin-top:12px}.speed-control h3{margin-bottom:7px}.speed-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.speed-btn{border:1px solid #dceaf2;border-radius:11px;padding:8px 5px;background:white;color:#55768b;font-size:12px;font-weight:850}.speed-btn.selected{border-color:#71b9db;background:#effaff;color:#1677b1;box-shadow:inset 0 0 0 1px #71b9db}.start-btn{width:100%;margin-top:9px;padding:12px;border-radius:14px;background:#8bbd32;color:white;font-size:14px;font-weight:950;box-shadow:0 5px 0 #6a9a20}.start-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #6a9a20}.start-btn:disabled{opacity:.45;cursor:default;transform:none}
  .howto{border-top:1px solid #e4eef3;padding-top:13px}.howto h3{margin-bottom:7px}.howto p{margin:0;color:#71899a;font-size:12px;line-height:1.55}.tip{border-radius:14px;background:#fff7e8;padding:11px 12px;color:#846a36;font-size:11px;line-height:1.45;font-weight:700}.tip b{color:#735621}
  .bottom-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}.bottom-row button{flex:1 1 135px}.sound-btn,.restart-btn{background:#f0f7fa;border:1px solid #deebf1;border-radius:12px;padding:9px 11px;font-size:11px;font-weight:800;color:#5c7b8d}.restart-btn{color:#b96257;background:#fff5f2;border-color:#f5ded8}
  footer{text-align:center;color:#91a7b5;font-size:11px;margin:13px 0 0}
  @media(max-width:820px){.app{padding:14px 12px 22px}.layout{grid-template-columns:minmax(0,1fr)}.stage-card{width:100%;height:clamp(320px,62svh,520px);min-height:320px;aspect-ratio:auto;border-radius:21px}.side-card{padding:14px;border-radius:21px}.top-note{display:none}.stage-hud{left:12px;right:12px;top:11px}.pill{padding:6px 9px}.pill strong{font-size:16px}.side-card{display:grid;grid-template-columns:1fr 1fr;gap:12px}.score-area{grid-column:1/-1}.controls{grid-column:1/-1}.howto{grid-column:1/-1}.tip{grid-column:1/-1}.bottom-row{grid-column:1/-1}.scoreboard{grid-template-columns:1fr 1fr}.score-row{padding:8px}.stage-message{padding:17px 18px}.stage-message p{font-size:13px}}
  @media(max-width:440px){header{margin-bottom:10px}.brand{gap:10px}.logo{height:42px;width:42px;font-size:24px;border-radius:14px}.subtitle{font-size:11px}.stage-card{height:min(102vw,62svh);min-height:320px}.stage-message{width:88%}.scoreboard{grid-template-columns:1fr}.side-card{grid-template-columns:1fr}.score-area,.controls,.howto,.tip,.bottom-row{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="logo">🎣</div><div><h1 data-i18n="title">釣魚大作戰</h1><div class="subtitle" id="subtitle" data-i18n="subtitle">魚池轉呀轉，等魚張開口就落鈎！</div></div></div>
    <div class="header-actions"><div class="top-note" id="topNote" data-i18n="topNote">🐟 立體魚池 · 將魚放入透明桶</div><button class="language-btn" id="languageBtn" type="button" aria-label="Switch language">EN</button></div>
  </header>
  <main class="layout">
    <section class="stage-card" id="stage">
      <canvas id="pond" aria-label="轉動中的釣魚池塘" data-i18n-aria="canvasLabel"></canvas>
      <div class="stage-hud"><div class="pill" id="turnPill" role="status" aria-live="polite">準備好未？</div><div class="pill">⏱ <strong id="timer">60</strong></div></div>
      <div class="stage-message hidden" id="message" hidden aria-hidden="true">
        <div class="emoji" id="messageEmoji">🐠</div><h2 id="messageTitle">準備開始釣魚？</h2><p id="messageText">按住魚竿柄，將魚鈎穿過張開嘅黑色嘴位，再向上抽起。帶住魚去自己透明桶上方放手，魚就會跌入桶內並得分。</p><button class="message-btn" id="messageBtn">開始遊戲</button>
      </div>
    </section>
    <aside class="side-card">
      <div class="score-area"><div class="score-title"><h2 data-i18n="scoreTitle">今場分數</h2><span class="best"><span data-i18n="best">個人最佳</span> <b id="bestScore">0</b></span></div><div class="scoreboard" id="scoreboard"></div></div>
      <div class="controls"><h3 data-i18n="appearanceTitle">遊戲外觀</h3><div class="mode-grid"><button class="appearance-btn selected" data-visual="cartoon" data-i18n="cartoonMode">🎨 卡通版</button><button class="appearance-btn" data-visual="real" data-i18n="realMode">🌊 真實版</button></div><h3 data-i18n="chooseMode">選擇玩法</h3><div class="mode-grid"><button class="mode-btn selected" data-mode="solo" data-i18n="solo">🎣 單人挑戰</button><button class="mode-btn" data-mode="duel" data-i18n="duel">⚔️ 雙人對戰</button></div><div class="speed-control"><h3 id="speedTitle" data-i18n="speedTitle">魚池及魚嘴速度</h3><div class="speed-grid"><button class="speed-btn" data-speed="0.7" data-i18n="slow">慢</button><button class="speed-btn selected" data-speed="1" data-i18n="medium">中</button><button class="speed-btn" data-speed="1.5" data-i18n="fast">快</button></div></div><div class="speed-control"><label id="ringLabel" for="ringCount" data-i18n="ringCount">魚盤圈數</label> <select id="ringCount"><option value="1" data-i18n="oneRing">1 圈</option><option value="2" selected data-i18n="twoRings">2 圈</option><option value="3" data-i18n="threeRings">3 圈</option></select></div><button class="start-btn" id="startBtn">開始單人挑戰</button></div>
      <div class="howto"><h3 data-i18n="howToTitle">點樣玩</h3><p id="howToText" data-i18n="howTo">按住魚竿柄拖動，魚鈎穿過張開嘅黑色嘴圈再向上抽起。將魚帶到自己嘅透明魚桶，放手放魚入桶並得分；魚會喺桶內游動。</p></div>
      <div class="tip"><b data-i18n="tipLabel">小貼士：</b><span id="tipText" data-i18n="tip">慢、中、快三檔會同時調整魚池旋轉同魚嘴開合速度；桶外放手，魚會返魚盤。</span></div>
      <div class="bottom-row"><button class="sound-btn" id="musicBtn" type="button">🎵 音樂：開</button><button class="sound-btn" id="sfxBtn" type="button">🔊 音效：開</button><button class="restart-btn" id="restartBtn" data-i18n="restart">↻ 重新開始</button></div>
    </aside>
  </main>
  <footer data-i18n="footer">單人限時 60 秒 · 雙人輪流各 30 秒 · 手機、平板和電腦都可以玩</footer>
</div>

  function startGame(){state.mode=state.mode||'solo';state.players=state.mode==='solo'?[{name:tr('you'),color:COLORS[0],score:0,streak:0}]:[{name:tr('player1'),color:COLORS[0],score:0,streak:0},{name:tr('player2'),color:COLORS[1],score:0,streak:0}];state.turn=0;state.time=state.mode==='solo'?60:30;state.phase='playing';state.round=0;state.newRecord=false;state.fish=makeFish();state.bucketFish=[];state.hookedFish=null;$('#startBtn').disabled=true;ringSelect.disabled=true;setMessage(false);state.showFirstTutorial=!localStorage.getItem('fishingTutorialSeen');if(state.showFirstTutorial)localStorage.setItem('fishingTutorialSeen','1');if(state.mode==='duel')beginCountdown();else{toast(state.showFirstTutorial?tr('firstLesson'):tr('soloToast'),3.6);state.showFirstTutorial=false;startMusic();}updateHUD();}

    stopMusic();state.phase='finished';const old=Number(localStorage.getItem('fishingBest')||0),best=Math.max(...state.players.map(p=>p.score)),isRecord=best>old;state.newRecord=isRecord;if(isRecord)localStorage.setItem('fishingBest',String(best));const win=state.players.length===1?tr('challengeDone'):state.players[0].score===state.players[1].score?tr('tie'):state.players[0].score>state.players[1].score?tr('p1Wins'):tr('p2Wins');msgEmoji.textContent=state.players.length===1?'🏆':'🎉';msgTitle.textContent=win;msgText.textContent=state.players.map((p,i)=>`${state.mode==='duel'?(i===0?tr('player1'):tr('player2')):tr('you')}: ${p.score} ${tr('points')}`).join('　　')+`\n${tr('best')}: ${Math.max(old,best)}${isRecord?' · '+tr('newRecord'):''}`;msgBtn.textContent=tr('again');msgBtn.onclick=null;setMessage(true);$('#startBtn').disabled=false;ringSelect.disabled=false;$('#startBtn').textContent=tr('again');updateHUD();}
  msgBtn.addEventListener('click',()=>{if(state.phase==='handoff'){setMessage(false);beginCountdown();return;}if(state.phase==='ready')startGame();else if(state.phase==='finished')startGame();});
  $('#startBtn').addEventListener('click',()=>{if(state.phase==='finished'){startGame();return;}if(state.phase!=='playing')startGame();});
  $('#restartBtn').addEventListener('click',()=>{stopMusic();state.phase='ready';state.players=[];state.turn=0;state.time=state.mode==='solo'?60:30;state.fish=makeFish();state.hookedFish=null;state.bucketFish=[];state.pointer.moved=false;state.pointer.returning=false;state.pointer.inside=false;state.showFirstTutorial=false;state.newRecord=false;state.countdownValue=0;lineSwing.angle=0;lineSwing.velocity=0;msgEmoji.textContent='🐠';msgTitle.textContent=tr('readyTitle');msgText.textContent=tr('readyText');msgBtn.textContent=tr('start');msgBtn.onclick=null;setMessage(false);$('#startBtn').disabled=false;ringSelect.disabled=false;$('#startBtn').textContent=state.mode==='solo'?tr('soloStart'):tr('duelStart');updateHUD();});
  $('#musicBtn').addEventListener('click',e=>{state.music=!state.music;e.currentTarget.textContent=state.music?tr('musicOn'):tr('musicOff');if(state.music)startMusic();else stopMusic();});$('#sfxBtn').addEventListener('click',e=>{state.sfx=!state.sfx;e.currentTarget.textContent=state.sfx?tr('sfxOn'):tr('sfxOff');if(state.sfx)beep(620,.08);});
  function updateHUD(){const secs=Math.ceil(state.time);$('#timer').textContent=String(secs).padStart(2,'0');$('#turnPill').textContent=state.phase==='countdown'?String(state.countdownValue||3):state.phase==='playing'?(state.mode==='duel'?(state.turn===0?tr('player1'):tr('player2')):tr('you'))+' '+tr('turn'):state.phase==='handoff'?tr('handoff'):state.phase==='finished'?tr('finished'):tr('ready');
    $('#bestScore').textContent=localStorage.getItem('fishingBest')||'0';const board=$('#scoreboard');const players=state.players.length?state.players:[{name:tr('you'),color:COLORS[0],score:0},...(state.mode==='duel'?[{name:tr('player2'),color:COLORS[1],score:0}]:[])];board.innerHTML=players.map((p,i)=>`<div class="score-row ${state.phase==='playing'&&i===state.turn?'active':''}"><i class="player-dot" style="--pc:${p.color}"></i><span class="player-label">${state.mode==='duel'?(i===0?tr('player1'):tr('player2')):tr('you')}</span><span class="player-points">${p.score}<small>${tr('points')}</small></span></div>`).join('');}

  setMode('solo');applyLanguage();updateAppearanceText();updateHUD();
})();
</script>
