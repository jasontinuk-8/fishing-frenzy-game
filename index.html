<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f5fbff">
<title>釣魚大作戰 | Fishing Frenzy</title>
<style>
  :root{--ink:#193750;--muted:#688296;--blue:#2587c7;--aqua:#e8f7ff;--line:#d9eaf4;--coral:#ff786c;--lime:#c5e95b;--shadow:0 16px 45px #28547314}

  .top-note{border:1px solid #dcecf4;border-radius:999px;padding:9px 14px;background:#ffffffb8;color:#57778c;font-size:12px;font-weight:700}.header-actions{display:flex;align-items:center;gap:9px}.language-btn{border:1px solid #dcecf4;border-radius:999px;padding:9px 13px;background:#fff;color:#357595;font-size:12px;font-weight:900}.language-btn:active{transform:scale(.97)}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:stretch}
  .stage-card,.side-card{background:#ffffffd9;border:1px solid #deedf5;border-radius:25px;box-shadow:var(--shadow)}

  canvas{width:100%;height:100%;position:absolute;inset:0;touch-action:none}

  .pill strong{color:#173b59;font-size:18px;margin-left:5px;letter-spacing:.3px}
  .stage-message{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86%,360px);padding:23px 24px 20px;border:1px solid #d9edf6;border-radius:24px;background:#fffffff2;box-shadow:0 18px 48px #17496a28;text-align:center;backdrop-filter:blur(10px);transition:opacity .2s,transform .2s}
  .stage-message.hidden{opacity:0;pointer-events:none;transform:translate(-50%,-46%)}
  .stage-message .emoji{font-size:38px;line-height:1.1;margin-bottom:8px}.stage-message h2{margin:0;font-size:22px}.stage-message p{font-size:14px;color:#658095;line-height:1.55;margin:9px 0 15px}
  .message-btn{background:#2388c4;color:white;border-radius:13px;padding:11px 19px;font-weight:900;box-shadow:0 5px 0 #176b9d;transition:transform .1s,box-shadow .1s}.message-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #176b9d}
  .side-card{padding:18px;display:flex;flex-direction:column;gap:16px}
  .score-title{display:flex;align-items:center;justify-content:space-between}.score-title h2{font-size:16px;margin:0}.best{font-size:11px;color:#71899a;font-weight:750}
  .scoreboard{display:grid;gap:9px}.score-row{display:flex;align-items:center;gap:11px;border:1px solid #e1edf3;border-radius:15px;padding:10px 12px;background:#fbfdfe;transition:transform .2s,border-color .2s}.score-row.active{border-color:#63b6e3;background:#f1fbff;transform:translateX(2px)}
  .player-dot{width:13px;height:13px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 4px color-mix(in srgb,var(--pc),white 82%)}.player-label{font-size:13px;font-weight:800;flex:1}.player-points{font-size:20px;font-weight:950;color:#234d68}.player-points small{font-size:10px;color:#7a94a4;margin-left:3px}
  .controls h3{font-size:13px;margin:0 0 9px}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode-btn{border:1px solid #dceaf2;border-radius:13px;padding:10px 7px;background:white;font-size:12px;font-weight:800;color:#55768b}.mode-btn.selected{border-color:#63b6e3;background:#effaff;color:#1677b1;box-shadow:inset 0 0 0 1px #63b6e3}.speed-control{margin-top:12px}.speed-control h3{margin-bottom:7px}.speed-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.speed-btn{border:1px solid #dceaf2;border-radius:11px;padding:8px 5px;background:white;color:#55768b;font-size:12px;font-weight:850}.speed-btn.selected{border-color:#71b9db;background:#effaff;color:#1677b1;box-shadow:inset 0 0 0 1px #71b9db}.start-btn{width:100%;margin-top:9px;padding:12px;border-radius:14px;background:#8bbd32;color:white;font-size:14px;font-weight:950;box-shadow:0 5px 0 #6a9a20}.start-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #6a9a20}.start-btn:disabled{opacity:.45;cursor:default;transform:none}

  @media(max-width:440px){header{margin-bottom:10px}.brand{gap:10px}.logo{height:42px;width:42px;font-size:24px;border-radius:14px}.subtitle{font-size:11px}.stage-card{height:102vw;min-height:320px}.stage-message{width:88%}.scoreboard{grid-template-columns:1fr}.side-card{grid-template-columns:1fr}.score-area,.controls,.howto,.tip,.bottom-row{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="logo">🎣</div><div><h1 data-i18n="title">釣魚大作戰</h1><div class="subtitle" data-i18n="subtitle">魚池轉呀轉，等魚張開口就落鈎！</div></div></div>
    <div class="header-actions"><div class="top-note" data-i18n="topNote">🐟 立體魚池 · 將魚放入「你」字桶</div><button class="language-btn" id="languageBtn" type="button" aria-label="Switch language">EN</button></div>
  </header>
  <main class="layout">
    <section class="stage-card" id="stage">
      <canvas id="pond" aria-label="轉動中的釣魚池塘" data-i18n-aria="canvasLabel"></canvas>
      <div class="stage-hud"><div class="pill" id="turnPill">準備好未？</div><div class="pill">⏱ <strong id="timer">60</strong></div></div>
      <div class="stage-message" id="message">
        <div class="emoji" id="messageEmoji">🐠</div><h2 id="messageTitle">準備開始釣魚？</h2><p id="messageText">按住魚竿柄，將魚鈎穿過張開嘅黑色嘴位，再向上抽起。帶住魚去自己透明桶上方放手，魚就會跌入桶內並得分。</p><button class="message-btn" id="messageBtn">開始遊戲</button>
      </div>
    </section>
    <aside class="side-card">
      <div class="score-area"><div class="score-title"><h2 data-i18n="scoreTitle">今場分數</h2><span class="best"><span data-i18n="best">個人最佳</span> <b id="bestScore">0</b></span></div><div class="scoreboard" id="scoreboard"></div></div>
      <div class="controls"><h3 data-i18n="chooseMode">選擇玩法</h3><div class="mode-grid"><button class="mode-btn selected" data-mode="solo" data-i18n="solo">🎣 單人挑戰</button><button class="mode-btn" data-mode="duel" data-i18n="duel">⚔️ 雙人對戰</button></div><div class="speed-control"><h3 data-i18n="speedTitle">魚池及魚嘴速度</h3><div class="speed-grid"><button class="speed-btn" data-speed="0.7" data-i18n="slow">慢</button><button class="speed-btn selected" data-speed="1" data-i18n="medium">中</button><button class="speed-btn" data-speed="1.5" data-i18n="fast">快</button></div></div><div class="speed-control"><label for="ringCount" data-i18n="ringCount">魚盤圈數</label> <select id="ringCount"><option value="1" data-i18n="oneRing">1 圈</option><option value="2" selected data-i18n="twoRings">2 圈</option><option value="3" data-i18n="threeRings">3 圈</option></select></div><button class="start-btn" id="startBtn">開始單人挑戰</button></div>
      <div class="howto"><h3 data-i18n="howToTitle">點樣玩</h3><p data-i18n="howTo">按住魚竿柄拖動，魚鈎穿過張開嘅黑色嘴圈再向上抽起。將魚帶到自己嘅透明魚桶，放手放魚入桶並得分；魚會喺桶內游動。</p></div>
      <div class="tip"><b data-i18n="tipLabel">小貼士：</b><span data-i18n="tip">慢、中、快三檔會同時調整魚池旋轉同魚嘴開合速度；桶外放手，魚會返魚盤。</span></div>
      <div class="bottom-row"><button class="sound-btn" id="soundBtn">🎵 音樂及音效：開</button><button class="restart-btn" id="restartBtn" data-i18n="restart">↻ 重新開始</button></div>
    </aside>
  </main>
  <footer data-i18n="footer">單人限時 60 秒 · 雙人輪流各 30 秒 · 手機、平板和電腦都可以玩</footer>
</div>
<script>
(()=>{

yTitle:'Ready to fish?',readyText:'Hold the rod handle, guide the hook through an open black mouth, then lift. Carry your fish over your clear bucket and release to score.',start:'Start game',soloStart:'Start solo challenge',duelStart:'Start 2-player duel',soundOn:'🎵 Music & sound: On',soundOff:'🔇 Music & sound: Off',soloToast:'Lift the rod to hook a fish, carry it to your clear bucket, then release!',duelToast:'Player 1 starts! Hook a fish, carry it to your bucket, then release!',p2Toast:'Player 2 starts!',p2Turn:"Player 2's turn!",handoffText:'Pass the device to the next player. Start the second round when ready.',p2Start:'Start Player 2 round',handoff:'Pass to Player 2',finished:'Round over',challengeDone:'Challenge complete!',tie:"It's a tie!",p1Wins:'Player 1 wins!',p2Wins:'Player 2 wins!',again:'Play again',you:'You',player1:'Player 1',player2:'Player 2',turn:'turn',points:'pts',bucket:'Bucket',youLabel:'You'}};
  const tr=k=>I18N[state.lang][k]||I18N.zh[k]||k;
  function applyLanguage(){document.documentElement.lang=state.lang==='en'?'en':'zh-Hant';document.title=state.lang==='en'?'Fishing Frenzy':'釣魚大作戰 | Fishing Frenzy';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',tr(el.dataset.i18nAria)));$('#languageBtn').textContent=state.lang==='zh'?'EN':'中文';$('#soundBtn').textContent=state.sound?tr('soundOn'):tr('soundOff');if(state.phase==='ready'){$('#messageTitle').textContent=tr('readyTitle');$('#messageText').textContent=tr('readyText');$('#messageBtn').textContent=tr('start');}else if(state.phase==='handoff'){$('#messageTitle').textContent=tr('p2Turn');$('#messageText').textContent=tr('handoffText');$('#messageBtn').textContent=tr('p2Start');}else if(state.phase==='finished'){const win=state.players.length===1?tr('challengeDone'):state.players[0].score===state.players[1].score?tr('tie'):state.players[0].score>state.players[1].score?tr('p1Wins'):tr('p2Wins');$('#messageTitle').textContent=win;$('#messageText').textContent=state.players.map((p,i)=>`${state.mode==='duel'?(i===0?tr('player1'):tr('player2')):tr('you')}: ${p.score} ${tr('points')}`).join('　　');$('#messageBtn').textContent=tr('again');}$('#startBtn').textContent=state.phase==='finished'?tr('again'):(state.mode==='solo'?tr('soloStart'):tr('duelStart'));updateHUD();}
  $('#languageBtn').addEventListener('click',()=>{state.lang=state.lang==='zh'?'en':'zh';localStorage.setItem('fishingLang',state.lang);applyLanguage();});

  const state={lang:localStorage.getItem('fishingLang')||'zh',mode:'solo',phase:'ready',players:[],turn:0,time:60,angle:0,speed:1,ringCount:2,last:performance.now(),fish:[],bucketFish:[],pointer:{x:-100,y:-100,inside:false,moved:false},target:null,hookedFish:null,splashes:[],toast:'',toastUntil:0,sound:true,audio:null,musicTimer:null,round:0};
  const ringLayouts={
    1:[{n:12,r:.62}],
    2:[{n:12,r:.70},{n:8,r:.39}],
    3:[{n:13,r:.80},{n:9,r:.51},{n:4,r:.22}]
  };
  let W=0,H=0,DPR=1,cx=0,cy=0,R=0;
  const VIEW_TILT=.76;
  function resize(){const rect=canvas.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2);W=rect.width;H=rect.height;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);cx=W/2;cy=H*.36;R=Math.min(W*.418,H*.429);}
  new ResizeObserver(resize).observe(canvas); resize();
  function makeFish(){let arr=[];ringLayouts[state.ringCount].forEach((ring,ri)=>{for(let i=0;i<ring.n;i++)arr.push({a:Math.PI*2*i/ring.n+(ri===0?-.18:0),r:ring.r,ring:ri,phase:Math.random()*3.4,period:3.1+Math.random()*.9,openFor:.72+Math.random()*.26,color:['#fa735c','#4aafe0','#e875a9','#f4b641','#8c78d9','#55bd82'][Math.floor(Math.random()*6)],caught:0,wiggle:Math.random()*6.28});});return arr;}

  function fishMotion(f,t){const cycle=(t*state.speed+f.phase)%f.period,up=.48,open=f.openFor,down=.5,smooth=x=>x*x*(3-2*x);let lift=0,mouth=0,mouthOpen=false;if(cycle<up){lift=smooth(cycle/up);mouth=lift;}else if(cycle<up+open){lift=1;mouth=1;mouthOpen=true;}else if(cycle<up+open+down){lift=1-smooth((cycle-up-open)/down);mouth=lift;}return{lift,mouth,mouthOpen};}
  function fishOpen(f,t){return fishMotion(f,t).mouthOpen;}
  function fishSlotPos(f,t){const a=f.a+state.angle*(f.ring===1?-1.17:1),depthScale=.84+.18*((Math.sin(a)+1)/2);return{x:cx+Math.cos(a)*R*f.r,y:cy+Math.sin(a)*R*f.r*.78,a,depthScale};}
  function fishPos(f,t){const slot=fishSlotPos(f,t),motion=fishMotion(f,t),bob=Math.sin(t*3.2*state.speed+f.wiggle)*2.5;return{...slot,y:slot.y+bob+(1-motion.lift)*R*.06-motion.lift*R*.14,lift:motion.lift,mouth:motion.mouth,scaleY:1,scaleBody:1};}
  function fishMouthPos(f,p,t){const size=R*(f.ring===0?.22:.23),depth=p.depthScale||1,scaleY=(p.scaleY||1)*depth*.82;return{x:p.x+size*.04*scaleY,y:p.y-size*.37*depth};}
  function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}}
  const bucketWidth=.98,bucketHeight=.78;
  function basketPoint(index){return{x:W*.5,y:H*.94};}
  function defaultHand(){return{x:W*.84,y:H*.58};}
  function rodSide(){return state.mode==='duel'?(state.turn===0?1:-1):-1;}
  const lineSwing={angle:0,velocity:0};
  function moveLine(deltaX){
    const lag=deltaX/Math.max(1,R*.73);

  function animateLine(dt){
    const steps=Math.max(1,Math.ceil(dt*120));

    for(let i=0;i<steps;i++){

  function drawBucket(p,color,label,t){
    const w=R*bucketWidth,h=R*bucketHeight,top=p.y-h*.5,bottom=p.y+h*.5;

  function tryHookOnLift(from,to,t){
    if(!from||state.phase!=='playing'||state.hookedFish||to.y>=from.y-Math.max(1,R*.003))return false;
    for(const f of state.fish){if(segmentHitsOpenMouth(f,from,to,t)){state.hookedFish={fish:f,player:state.turn,depthScale:fishSlotPos(f,t).depthScale};state.target=f;state.toast='';beep(780,.09);navigator.vibrate?.(65);return true;}}
    return false;
  }
  function carriedFishPose(held,hook){const f=held.fish,size=R*(f.ring===0?.22:.23),depth=held.depthScale||1;return{x:hook.x-size*.04*depth*.82,y:hook.y+size*.37*depth,depthScale:depth,lift:1,scaleY:1,scaleBody:1};}
  function dropFishIntoBucket(t){
    const held=state.hookedFish;if(!held||state.phase!=='playing')return;
    const bucket=basketPoint(held.player),hook=hookPosition(),p=carriedFishPose(held,hook);
    if(Math.abs(p.x-bucket.x)>R*bucketWidth/2||p.y<bucket.y-R*bucketHeight/2||p.y>bucket.y+R*bucketHeight*.46){state.hookedFish=null;state.target=null;return false;}
    const player=state.players[held.player];if(!player)return;
    const streak=(player.streak||0)+1,bonus=streak%5===0?10:0;player.streak=streak;player.score+=10+bonus;
    const label=state.mode==='duel'?'P'+(held.player+1):'solo',f=held.fish,stored={fish:f,player:label,dx:(Math.random()-.5)*R*.14,dy:(Math.random()-.5)*R*.15,startX:p.x-bucket.x,startY:p.y-bucket.y,scale:.63+Math.random()*.10,phase:Math.random()*Math.PI*2,born:t};state.bucketFish.push(stored);f.caught=Infinity;state.hookedFish=null;state.splashes.push({x:bucket.x,y:bucket.y-R*.2,t,text:bonus?'+20':'+10',color:'#fff084'});
    beep(740,.09);return true;
  }
  function locate(e,canHook=false){
    const pointer=state.pointer;
    const from=canHook&&pointer.moved?hookPosition():null;
    const bounds=canvas.getBoundingClientRect();
    const x=e.clientX-bounds.left;
    if(pointer.moved)moveLine(x-pointer.x);
    pointer.x=x;
    pointer.y=cy+(e.clientY-bounds.top-cy)/VIEW_TILT;
    pointer.inside=true;
    pointer.moved=true;
    const hook=hookPosition(),t=performance.now()/1000;
    state.target=nearest(hook.x,hook.y);
    if(from)tryHookOnLift(from,hook,t);
  }
  let gripPointer=null;
  canvas.addEventListener('pointermove',e=>{
    if(gripPointer===e.pointerId)locate(e,true);
    else if(gripPointer===null&&e.pointerType==='mouse')locate(e);
  });
  canvas.addEventListener('pointerleave',()=>{state.pointer.inside=false;state.target=null;});
  canvas.addEventListener('pointerdown',e=>{
    if(gripPointer!==null||e.button!==0)return;
    e.preventDefault();
    gripPointer=e.pointerId;
    try{canvas.setPointerCapture(e.pointerId);}catch(_){}
    locate(e);
    if(state.phase==='ready')startGame();
  });
  window.addEventListener('pointerup',e=>{
    if(gripPointer!==e.pointerId)return;
    gripPointer=null;
    locate(e);
    dropFishIntoBucket(performance.now()/1000);
  });
  function cancelGrip(e){
    if(gripPointer!==e.pointerId)return;
    gripPointer=null;
    state.hookedFish=null;
    state.target=null;
  }
  canvas.addEventListener('pointercancel',cancelGrip);
  canvas.addEventListener('lostpointercapture',cancelGrip);
  window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(state.phase==='ready')startGame();}});
  function toast(s){state.toast=s;state.toastUntil=performance.now()/1000+1.25;}
  function beep(freq,duration){if(!state.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!state.audio)state.audio=new AC();if(state.audio.state==='suspended')state.audio.resume();const o=state.audio.createOscillator(),g=state.audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.07,state.audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,state.audio.currentTime+duration);o.connect(g);g.connect(state.audio.destination);o.start();o.stop(state.audio.currentTime+duration);}catch(_){}}
  function stopMusic(){if(state.musicTimer){clearInterval(state.musicTimer);state.musicTimer=null;}}
  function startMusic(){if(!state.sound||state.phase!=='playing'||state.musicTimer)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!state.audio)state.audio=new AC();if(state.audio.state==='suspended')state.audio.resume();const notes=[523,659,784,659,587,698,880,698,659,784,1046,784,698,659,587,523];let i=0;state.musicTimer=setInterval(()=>{if(!state.sound||state.phase!=='playing'){stopMusic();return;}const now=state.audio.currentTime,o=state.audio.createOscillator(),g=state.audio.createGain();o.type='triangle';o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.028,now+.025);g.gain.exponentialRampToValueAtTime(.0001,now+.24);o.connect(g);g.connect(state.audio.destination);o.start(now);o.stop(now+.25);},310);}catch(_){stopMusic();}}
  function setMode(mode){if(state.phase==='playing')return;state.mode=mode;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('selected',b.dataset.mode===mode));$('#startBtn').textContent=mode==='solo'?tr('soloStart'):tr('duelStart');updateHUD();}
  function setSpeed(speed){state.speed=Number(speed);document.querySelectorAll('.speed-btn').forEach(b=>b.classList.toggle('selected',Number(b.dataset.speed)===state.speed));}
  document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
  document.querySelectorAll('.speed-btn').forEach(b=>b.addEventListener('click',()=>setSpeed(b.dataset.speed)));
  const ringSelect=$('#ringCount');
  ringSelect.addEventListener('change',()=>{
    state.ringCount=Number(ringSelect.value);
    if(state.phase==='ready'){
      state.fish=makeFish();
      state.target=null;
    }
  });
  function startGame(){state.mode=state.mode||'solo';state.players=state.mode==='solo'?[{name:tr('you'),color:COLORS[0],score:0,streak:0}]:[{name:tr('player1'),color:COLORS[0],score:0,streak:0},{name:tr('player2'),color:COLORS[1],score:0,streak:0}];state.turn=0;state.time=state.mode==='solo'?60:30;state.phase='playing';state.round=0;state.fish=makeFish();state.bucketFish=[];state.hookedFish=null;$('#startBtn').disabled=true;ringSelect.disabled=true;msg.classList.add('hidden');toast(state.mode==='solo'?tr('soloToast'):tr('duelToast'));updateHUD();startMusic();}
  function finishTurn(){state.hookedFish=null;if(state.mode==='duel'&&state.turn===0){stopMusic();state.turn=1;state.time=30;state.phase='handoff';msgEmoji.textContent='🔄';msgTitle.textContent=tr('p2Turn');msgText.textContent=tr('handoffText');msgBtn.textContent=tr('p2Start');msgBtn.onclick=()=>{state.phase='playing';msg.classList.add('hidden');toast(tr('p2Toast'));startMusic();};msg.classList.remove('hidden');updateHUD();return;}
    stopMusic();state.phase='finished';const win=state.players.length===1?tr('challengeDone'):state.players[0].score===state.players[1].score?tr('tie'):state.players[0].score>state.players[1].score?tr('p1Wins'):tr('p2Wins');msgEmoji.textContent=state.players.length===1?'🏆':'🎉';msgTitle.textContent=win;msgText.textContent=state.players.map(p=>`${p.name}: ${p.score} ${tr('points')}`).join('　　');msgBtn.textContent=tr('again');msgBtn.onclick=()=>startGame();msg.classList.remove('hidden');$('#startBtn').disabled=false;ringSelect.disabled=false;$('#startBtn').textContent=tr('again');const best=Math.max(...state.players.map(p=>p.score));const old=Number(localStorage.getItem('fishingBest')||0);if(best>old)localStorage.setItem('fishingBest',best);updateHUD();}
  msgBtn.addEventListener('click',()=>{if(state.phase==='handoff'){state.phase='playing';msg.classList.add('hidden');return;}if(state.phase==='ready')startGame();else if(state.phase==='finished')startGame();});
  $('#startBtn').addEventListener('click',()=>{if(state.phase==='finished'){startGame();return;}if(state.phase!=='playing')startGame();});
  $('#restartBtn').addEventListener('click',()=>{stopMusic();state.phase='ready';state.players=[];state.turn=0;state.time=state.mode==='solo'?60:30;state.fish=makeFish();state.hookedFish=null;state.bucketFish=[];msgEmoji.textContent='🐠';msgTitle.textContent=tr('readyTitle');msgText.textContent=tr('readyText');msgBtn.textContent=tr('start');msgBtn.onclick=null;msg.classList.remove('hidden');$('#startBtn').disabled=false;ringSelect.disabled=false;$('#startBtn').textContent=state.mode==='solo'?tr('soloStart'):tr('duelStart');updateHUD();});
  $('#soundBtn').addEventListener('click',e=>{state.sound=!state.sound;e.currentTarget.textContent=state.sound?tr('soundOn'):tr('soundOff');if(state.sound){beep(620,.08);startMusic();}else stopMusic();});
  function updateHUD(){const secs=Math.ceil(state.time);$('#timer').textContent=String(secs).padStart(2,'0');$('#turnPill').textContent=state.phase==='playing'?(state.mode==='duel'?(state.turn===0?tr('player1'):tr('player2')):tr('you'))+' '+tr('turn'):state.phase==='handoff'?tr('handoff'):state.phase==='finished'?tr('finished'):tr('ready');
    $('#bestScore').textContent=localStorage.getItem('fishingBest')||'0';const board=$('#scoreboard');const players=state.players.length?state.players:[{name:tr('you'),color:COLORS[0],score:0},...(state.mode==='duel'?[{name:tr('player2'),color:COLORS[1],score:0}]:[])];board.innerHTML=players.map((p,i)=>`<div class="score-row ${state.phase==='playing'&&i===state.turn?'active':''}"><i class="player-dot" style="--pc:${p.color}"></i><span class="player-label">${state.mode==='duel'?(i===0?tr('player1'):tr('player2')):tr('you')}</span><span class="player-points">${p.score}<small>${tr('points')}</small></span></div>`).join('');}

  setMode('solo');applyLanguage();updateHUD();
})();
</script>
